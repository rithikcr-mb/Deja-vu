<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="mentor-title mentor-desc">
  <title id="mentor-title">The Construct mentor</title>
  <desc id="mentor-desc">A simple hooded human figure outlined in terminal green against a dark field of data lines.</desc>
  <defs>
    <radialGradient id="mentor-halo" cx="50%" cy="38%" r="54%">
      <stop offset="0%" stop-color="#57f287" stop-opacity=".19"/>
      <stop offset="58%" stop-color="#57f287" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#57f287" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mentor-robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10251a"/>
      <stop offset="1" stop-color="#050b07"/>
    </linearGradient>
    <linearGradient id="mentor-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bffac"/>
      <stop offset=".55" stop-color="#57f287"/>
      <stop offset="1" stop-color="#1c6b3f"/>
    </linearGradient>
    <filter id="mentor-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mentor-frame">
      <rect x="10" y="10" width="340" height="420" rx="4"/>
    </clipPath>
  </defs>

